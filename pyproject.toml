[project]
name = "agentkit"
version = "0.1.0"
description = "Framework for chat agents that work on a service repo: tool loop, storage, memory, codebase map, learning, and an HTTP API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "openai>=1.40",
    "markdown>=3.6",
]

[project.scripts]
agentkit = "agentkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
